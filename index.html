<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda</title>
<meta name="description" content="Lentes blue light y gafas de sol en Caracas. Pedidos por WhatsApp.">
<meta property="og:title" content="Tienda">
<meta property="og:description" content="Lentes blue light y gafas de sol en Caracas. Pedidos por WhatsApp.">
<meta property="og:image" content="assets/gafas-negro.webp">
<meta name="theme-color" content="#4fdcef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<div class="sky" aria-hidden="true"></div>

<header class="top">
  <nav class="nav" aria-label="Principal">
    <a href="#/" data-nav="inicio">Inicio</a>
    <a href="#/productos" data-nav="productos">Productos</a>
    <a href="#/contacto" data-nav="contacto">Contacto</a>
  </nav>
  <div class="tools">
    <form class="search" role="search">
      <input id="search-q" type="search" placeholder="Buscar…" aria-label="Buscar productos">
      <button type="button" class="icon-btn search-toggle" aria-label="Buscar" aria-controls="search-q" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
    </form>
    <a class="icon-btn cart-link" href="#/carrito" aria-label="Carrito">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
      <span class="badge" hidden>0</span>
    </a>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot" id="contacto">
  <div>
    <p>Caracas, Venezuela<span id="foot-wa"></span></p>
  </div>
  <ul class="pay" aria-label="Métodos de pago">
    <li class="pay-chip pm">Pago Móvil</li>
    <li class="pay-chip bn">Binance</li>
    <li class="pay-chip ef">Efectivo</li>
  </ul>
</footer>

<div class="toast" role="status" aria-live="polite"></div>

<dialog id="zoom-dialog" aria-label="Foto ampliada">
  <button type="button" class="zoom-close icon-btn" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <img alt="">
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
